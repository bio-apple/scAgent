[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scagent"
version = "0.1.0"
description = "LangGraph-based single-cell RNA-seq analysis agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.45",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
analysis = [
  "scanpy>=1.10",
  "anndata>=0.10",
  "harmonypy",
  "leidenalg",
  "igraph",
]
dev = ["pytest>=8.0"]

[project.scripts]
scagent = "scagent.cli:main"

[tool.setuptools.packages.find]
include = ["scagent*", "agents*", "workflows*", "rag*", "sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
