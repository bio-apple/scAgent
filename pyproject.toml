[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scagent"
version = "0.1.0"
description = "LangGraph-based single-cell RNA-seq analysis agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.45",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=3.0"]
checkpoint = ["langgraph-checkpoint-sqlite>=2.0"]
analysis = [
  "scanpy>=1.10,<1.12",
  "anndata>=0.10",
  "harmonypy>=0.0.10",
  "leidenalg>=0.10",
  "igraph>=0.11",
  "celltypist>=1.6",
  "scvi-tools>=1.1,<2",
  "scanorama>=1.7",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]
loom = ["loompy>=3.0"]
bbknn = ["bbknn>=1.6"]
trajectory = ["palantir>=1.3", "scvelo>=0.3"]
dev = ["pytest>=8.0", "flake8>=7.0", "black>=24.0"]
# Legacy alias; pymupdf + pdfplumber are core deps since 0.1.0
papers = ["pymupdf>=1.24", "pdfplumber>=0.11"]
mineru = ["mineru[pipeline]>=2.0"]
"magic-pdf" = ["magic-pdf[full]>=1.3"]

[project.scripts]
scagent = "scagent.cli:main"

[tool.setuptools.packages.find]
include = ["scagent*", "agents*", "workflows*", "rag*", "sandbox*"]

[tool.setuptools.package-data]
scagent = ["r/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
